# ------------------------------------------------------------------------------
#                -= Arno's iptables firewall - Docker plugin =-
# ------------------------------------------------------------------------------

# To actually enable this plugin make ENABLED=1:
# ------------------------------------------------------------------------------
ENABLED=0

# The Docker (bridge) interfaces. "docker0" is Docker's default bridge, "br-+"
# matches the bridges of user-defined Docker networks (br-<network id>).
# Note: "br-+" also matches other bridges with a name starting with "br-".
#
# Docker adds its own rules (forwarding, NAT, published ports) to the iptables
# tables. On a restart of this firewall this plugin keeps them. After a (full)
# start, eg. after a stop, they are gone and Docker has to be restarted.
# ------------------------------------------------------------------------------
DOCKER_IF="docker0 br-+"

# Ports (services) on this host the containers may use, eg. a database running
# on the host that containers reach via the bridge address (like 172.17.0.1).
# Ranges and lists are allowed, eg. "3306 5432 8000:8100". Leave empty when the
# containers only need the internet.
# ------------------------------------------------------------------------------
DOCKER_HOST_OPEN_TCP=""
DOCKER_HOST_OPEN_UDP=""

# (EXPERT SETTING!) Allow the containers to use ALL services (ports) on this
# host (1), so DOCKER_HOST_OPEN_TCP/UDP aren't needed.
# WARNING: Every container (also a compromised or misbehaving one) can then
# reach everything this host offers, like SSH, admin interfaces and services
# meant for local use only. Prefer DOCKER_HOST_OPEN_TCP/UDP when possible!
# ------------------------------------------------------------------------------
DOCKER_HOST_OPEN_ALL=0
